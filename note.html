<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Study Library</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="reader.css" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      const t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="nav">
    <div class="reader-wrap nav-inner">
      <a href="./" class="logo">← Library</a>
      <a id="source-link" class="nav-source" target="_blank" rel="noopener">View on GitHub</a>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle color theme">◐</button>
    </div>
  </header>

  <div class="reader-wrap reader">
    <aside class="toc">
      <details id="toc-details" open>
        <summary>Contents</summary>
        <nav id="toc"></nav>
      </details>
    </aside>

    <main>
      <p id="meta" class="reader-meta"></p>
      <div id="progress" class="progress" hidden></div>
      <article id="doc" class="markdown">
        <p class="status">Loading…</p>
      </article>
    </main>
  </div>

  <button id="to-top" class="to-top" aria-label="Back to top" hidden>↑</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="notes.js"></script>
  <script src="script.js"></script>
  <script src="reader.js"></script>
</body>
</html>
